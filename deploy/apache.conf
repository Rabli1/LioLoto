ServerTokens Prod

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    ServerSignature Off

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Only the root Laravel front controller may execute PHP.
    <FilesMatch "(?i)\.(php[0-9]*|phtml|pht|phar|inc)(\.|$)">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>
    # Files matches use basenames; prevent nested/uploaded index.php exceptions.
    <LocationMatch "(?i)^/(?!index\.php(?:/|$)).*\.(php[0-9]*|phtml|pht|phar|inc)(?:/|$)">
        Require all denied
    </LocationMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
